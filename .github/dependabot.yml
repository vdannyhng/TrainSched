# SDLC Betrieb: wöchentliche Updates. Expo/React Native nur über SDK-Upgrades (`npx expo install --fix`).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'typescript'
      # Versionen gibt das Expo SDK vor (expo-doctor prüft das)
      - dependency-name: '@shopify/flash-list'
      # Major-Sprünge nur bewusst mit eigenem PR (Kompatibilität mit jest-expo/eslint-config-expo bzw. API-Umbau)
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@noble/ciphers'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
