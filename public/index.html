<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: als Home-Bildschirm-App bis in die Notch, Abstände über Safe-Area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="TrainSched – Termine, Notizen und Hausaufgaben für den Sprachunterricht"
    />
    <!-- Content-Security-Policy wird beim Web-Build eingesetzt (scripts/build-web.mjs) -->

    <!-- Installierbar als Web-App („Zum Home-Bildschirm“) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1F5F8B" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TrainSched" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #f7f8fa;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f1216;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Bitte JavaScript aktivieren, um TrainSched zu nutzen.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
